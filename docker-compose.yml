version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: controle_alvenaria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controle_alvenaria
    ports:
      - '5432:5432'
    volumes:
      - pgdata_alvenaria:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata_alvenaria:
